<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
<rect width="600" height="800" fill="#FBF4E4"/>
<g fill="#1F2A44" font-family="Arial,sans-serif" font-size="22">
<text x="45" y="90" font-size="29" font-weight="bold">Campus housing update</text>
<text x="45" y="155">Move-out for winter break is Dec 18</text>
<text x="45" y="190">by 5 PM. Leave your key at the</text>
<text x="45" y="225">front desk before leaving campus.</text>
<text x="45" y="295">Check your room and take your belongings.</text>
<text x="45" y="330">Close windows, switch off lights,</text>
<text x="45" y="365">and unplug personal appliances.</text>
<text x="45" y="435">Rooms will be checked on Dec 19.</text>
<text x="45" y="470">Items left behind will be stored</text>
<text x="45" y="505">for 30 days.</text>
<text x="45" y="575">Contact the housing office with questions.</text>
<text x="45" y="730" font-size="16" fill="#5B6275">SAMPLE DOCUMENT</text>
</g></svg>
